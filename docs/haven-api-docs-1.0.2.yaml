  /notifications/stream:
    get:
      tags:
        - Notifications
      summary: Open a server-sent-events stream of my notifications
      description: |
        Opens a long-lived `text/event-stream` connection. Every notification
        written for the caller — synchronous or Kafka-driven — is pushed as an
        SSE event the moment it commits. The event `name` is the
        {@code NotificationKind}; the {@code data} payload is
        `{ "id": ..., "kind": ..., "payload": {...} }`.

        Persona audit (Temi, Ngozi): the previous "poll /notifications/mine
        every 10s" pattern was both wasteful and laggy. SSE collapses both:
        no wasted hits when there's nothing new, and the user sees the event
        within milliseconds of it being recorded.

        Single-instance only for now — a future Redis pub-sub layer would
        fan out across nodes. Clients should reconnect on disconnect (browsers'
        EventSource does this automatically with backoff).
      operationId: stream
      responses:
        "200":
          description: SSE stream opened; events arrive as notifications are recorded.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
  /notifications/mine:
    get:
      tags:
        - Notifications
      summary: List my notifications
      description: >
        Paginated inbox scoped to the calling user. Notifications come from
        multiple sources:


        - **Sync writes**: verification approvals/rejections,
        agent-assignment   handshake decisions, listing takedowns, etc. —
        written in the same   transaction as the action that triggered them.

        - **Async Kafka events**: inspection requests, offer submissions
        —   published via the transactional outbox, consumed by listeners
        that   write the notification with `event_id` dedup.


        Use `?unreadOnly=true` to get just the unread inbox.
      operationId: listMine_4
      parameters:
        - name: unreadOnly
          in: query
          description: When true, return only notifications without `readAt`.
          required: false
          schema:
            type: boolean
            default: false
          example: false
        - name: kind
          in: query
          description: Filter by notification kind (OFFER_SUBMITTED,
            VERIFICATION_APPROVED, etc).
          required: false
          schema:
            type: string
            enum:
              - INSPECTION_REQUESTED
              - OFFER_SUBMITTED
              - VERIFICATION_APPROVED
              - VERIFICATION_REJECTED
              - LISTING_APPROVED
              - LISTING_LEAD_SUBMITTED
              - LISTING_TAKEDOWN
              - COMMENT_POSTED
              - AGENT_ASSIGNMENT_REQUESTED
              - AGENT_ASSIGNMENT_ACCEPTED
              - AGENT_ASSIGNMENT_DECLINED
              - AGENT_ASSIGNMENT_REVOKED
              - REVIEW_RECEIVED
              - OFFER_COUNTERED
              - OFFER_AUTO_DECLINED
              - LISTING_REPORTED
              - LISTING_REPORT_RESOLVED
              - WELCOME
              - VERIFICATION_SUBMITTED
              - INSPECTION_BOOKED
              - OFFER_RECEIVED_BY_PLATFORM
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Paginated notifications.
          content:
            "*/*":
              examples:
                TwoNotifications:
                  description: TwoNotifications
                  value:
                    content:
                      - id: 201
                        kind: OFFER_SUBMITTED
                        source: ASYNC
                        recipientUserId: 7
                        body: An applicant submitted an offer of NGN 7,500,000 on your listing.
                        data:
                          listingId: 17
                          offerId: 42
                          amount: 7500000
                        readAt: null
                        createdAt: 2026-05-10T08:30:01Z
                      - id: 200
                        kind: VERIFICATION_APPROVED
                        source: SYNC
                        recipientUserId: 7
                        body: Your owner-identity verification was approved.
                        data:
                          verificationId: 99
                          type: OWNER_IDENTITY
                        readAt: 2026-05-10T07:55:00Z
                        createdAt: 2026-05-10T07:50:00Z
                    page:
                      size: 20
                      number: 0
                      totalElements: 2
                      totalPages: 1
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
