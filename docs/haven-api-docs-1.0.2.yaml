  /admin/users/{id}/suspend:
    post:
      tags:
        - Admin
      summary: Suspend a user account
      description: >
        Stamps `users.suspended_at` and **bumps `tokenVersion`**. The
        token-version bump invalidates every outstanding JWT for the user —
        they'll be logged out the moment they make their next request,
        regardless of token expiry.


        **Defensive checks**:

        - Cannot suspend yourself (CannotModerateSelfException → 403).

        - Cannot suspend an already-suspended user (409).


        **Side effects**:

        - Audit log row written with the supplied reason.

        - `tokenVersion` bump revokes the user's sessions.


        **Reason**: required, non-empty.


        **Role gate**: `ADMIN`.
      operationId: suspend
      parameters:
        - name: id
          in: path
          description: User ID to suspend.
          required: true
          schema:
            type: integer
            format: int64
          example: 23
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserRequest"
        required: true
      responses:
        "200":
          description: User suspended.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UserAdminView"
              examples:
                SuspendedAgent:
                  description: SuspendedAgent
                  value:
                    id: 23
                    email: emeka@gmail.com
                    fullName: Emeka Okonkwo
                    role: AGENT
                    suspendedAt: 2026-05-10T16:00:00Z
                    createdAt: 2026-04-01T10:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
