  responses:
    Unauthenticated:
      description: Missing, expired, or revoked JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Unauthenticated:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/unauthenticated","title":"Unauthorized","status":401,"detail":"unauthenticated","instance":"/api/<request-path>"}'
    Forbidden:
      description: Caller authenticated but lacks the required role, ownership, or
        assignment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Forbidden:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/forbidden","title":"Forbidden","status":403,"detail":"forbidden","instance":"/api/<request-path>"}'
    NotFound:
      description: Target resource does not exist (or is no longer visible to the caller).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            NotFound:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/not-found","title":"Not
                Found","status":404,"detail":"User 999999 was not
                found","instance":"/api/users/999999/profile"}'
    Conflict:
      description: Request collides with current state — illegal state transition,
        duplicate row, or optimistic-lock contention.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Conflict:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/conflict","title":"Conflict","status":409,"detail":"resource
                state prevents this
                operation","instance":"/api/<request-path>"}'
    ValidationFailed:
      description: Request body or query parameter failed jakarta.validation constraints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            ValidationFailed:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/validation-failed","title":"Bad
                Request","status":400,"detail":"validation
                failed","instance":"/api/<request-path>","errors":[{"field":"email","message":"must
                be a well-formed email"}]}'
    RateLimited:
      description: Per-IP token bucket exhausted on a rate-limited path (currently
        `POST /auth/register` and `POST /auth/login`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            RateLimited:
              value: '{"type":"https://github.com/DreamHom/haven/blob/main/docs/errors/rate-limited","title":"Too
                Many Requests","status":429,"detail":"rate limit
                exceeded","instance":"/api/auth/login"}'
  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT issued by `POST /auth/login`. Send as `Authorization: Bearer
        <token>`."
      scheme: bearer
      bearerFormat: JWT
