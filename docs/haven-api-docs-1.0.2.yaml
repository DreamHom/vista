              - USER_REACTIVATED
              - REVIEW_TAKEDOWN
        - name: targetType
          in: query
          description: Restrict to a target type (USER, LISTING, VERIFICATION, REVIEW).
          required: false
          schema:
            type: string
            enum:
              - VERIFICATION
              - LISTING
              - USER
              - REVIEW
        - name: targetId
          in: query
          description: Restrict to a single target id (combine with targetType).
          required: false
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          description: Inclusive lower bound (ISO-8601 instant).
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive upper bound (ISO-8601 instant).
          required: false
          schema:
            type: string
            format: date-time
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated audit log entries, newest first.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PagedModelAdminAuditLogResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /admin/analytics/summary:
    get:
      tags:
        - Admin
      summary: Platform-health analytics summary
      description: >
        One-shot snapshot for the admin dashboard. Returns six aggregated
        counts:


        - `totalUsers` — every registered user, regardless of role or
        suspension.

        - `suspendedUsers` — users with `suspended_at` stamped
        (admin-actioned,   not self-deleted).

        - `openListings` — listings currently visible to public discovery
        (`LIVE`).

        - `closedListings` — listings whose deal has completed (`CLOSED`).

        - `pendingVerifications` — Dayo's work-queue depth (`PENDING` rows
        in   the `verifications` table).

        - `pendingOffers` — open deals where someone owes a response
        (`PENDING`   rows in the `offers` table).


        Each count is a single index-backed query; the endpoint runs in O(1)
        regardless of table size.


        **Role gate**: `ADMIN`.
      operationId: summary
      responses:
        "200":
          description: Aggregate counts for the dashboard.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AnalyticsSummaryResponse"
              examples:
                TypicalSummary:
                  description: TypicalSummary
                  value:
                    totalUsers: 1284
                    suspendedUsers: 3
                    openListings: 412
                    closedListings: 187
                    pendingVerifications: 8
                    pendingOffers: 47
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /admin/ad-campaigns:
    get:
      tags:
        - Admin
      summary: List ad campaigns
      description: Platform-wide, newest first.
      operationId: list_8
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated campaigns.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PagedModelAdCampaignResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /actuator:
    get:
      tags:
        - Observability
      summary: Discover available actuator endpoints
      description: >
        HAL+JSON discovery doc listing every actuator endpoint exposed by this
        app — health, info, prometheus, etc. Useful for tooling that introspects
        the management surface before deciding what to call.
      operationId: links
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/Link"
  /actuator/prometheus:
    get:
      tags:
        - Observability
      summary: Prometheus metrics scrape
      description: >
        Exposes Micrometer metrics in Prometheus' text exposition format.
        Includes:


        - `haven.outbox.unpublished` — depth of the transactional
        outbox   waiting to ship to Kafka. **Alert when non-zero for more
        than   a tick or two** — that signals the relay is failing or backed up.

        - Standard JVM metrics (heap, GC, threads).

        - Spring HTTP server metrics (request latency, error rate per   endpoint
        via `http.server.requests`).

        - Hikari connection pool metrics.


        Auth-gated. Configure your Prometheus scraper with a service-account
        token so polling doesn't expose the endpoint publicly.
      operationId: handle
      responses:
        "200":
          description: OK
          content:
            text/plain;version=0.0.4;charset=utf-8:
              schema:
                type: object
            application/vnd.google.protobuf;proto=io.prometheus.client.MetricFamily;encoding=delimited:
              schema:
                type: object
            application/openmetrics-text;version=1.0.0;charset=utf-8:
              schema:
                type: object
  /actuator/info:
    get:
      tags:
        - Observability
      summary: Build + environment metadata
      description: >
        Static info bundle (build version, git commit, active Spring profile).
        Useful for confirming which version is deployed where, especially during
        incident triage. Auth-gated to avoid leaking build metadata publicly.
      operationId: handle_1
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
  /actuator/health:
    get:
      tags:
        - Observability
      summary: Liveness + readiness probe
      description: >
        Returns `{ "status": "UP" }` when the app is running and downstream
        dependencies (Postgres, Kafka) are reachable. Anonymous in this
        deployment — exposed for load balancers, container orchestrators, and
        uptime monitors. A non-200 response means rolling traffic away from this
        instance is appropriate.


        For per-component drill-down (e.g. just the database health), use `GET
        /actuator/health/{component}`.
      operationId: handle_2
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
  /actuator/health/**:
    get:
      tags:
        - Observability
      summary: Per-component health drill-down
      description: >
        Returns the health status of a single component, e.g. `GET
        /actuator/health/db` for the datasource only. Useful when the aggregate
        `/actuator/health` is DOWN and you want to know which dependency is the
        cause without parsing the full breakdown.
      operationId: handle_3
      responses:
        "200":
          description: OK
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                type: object
            application/json:
              schema:
                type: object
            application/vnd.spring-boot.actuator.v2+json:
              schema:
                type: object
  /reviews/{id}:
    delete:
      tags:
        - Reviews
      summary: Soft-delete a review
      description: >
        Soft-deletes (sets `deleted_at`). The reviewee's aggregate
        (`averageRating`, `reviewCount`) is recomputed accordingly.


        **Authorisation** (service-enforced):

        - The review's author can delete their own review.

        - Any admin can delete any review (with reason — audit-friendly).

        - All others receive 403.


        Reason is required.
      operationId: delete
      parameters:
        - name: id
          in: path
          description: Review ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 14
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteReviewRequest"
        required: true
      responses:
        "204":
          description: Review soft-deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /me/agent-marketing/{id}:
    delete:
      tags:
        - Agent marketing gallery
      summary: Remove a marketing gallery item
      operationId: delete_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: No Content
      security:
        - bearerAuth: []
  /listings/videos/{videoId}:
    delete:
      tags:
        - Listing videos
      summary: Remove a listing video row (owner)
      operationId: delete_2
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/photos/{photoId}:
    delete:
      tags:
        - Listing photos
      summary: Remove a photo from a listing
      description: >
        Hard-deletes the `ListingPhoto` row. Surrounding photos keep their
        existing `displayOrder` values — gaps are tolerated, the gallery just
        skips them.


        **Ownership**: only the listing's owner can delete photos.
      operationId: delete_3
      parameters:
        - name: photoId
          in: path
          description: Photo ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 88
      responses:
        "204":
          description: Photo removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /inspections/{id}:
    delete:
      tags:
        - Inspections
      summary: Cancel my inspection request
      description: >
        Withdraws a PENDING inspection request the caller made — status flips to
        `CANCELLED`, the slot is freed for other applicants (the partial UQ on
        `inspection_requests(slot_id) WHERE status IN ('PENDING','APPROVED')` is
        what enforces the slot lock; the cancel drops out of that index).


        **Failure modes**:

        - `403` if the caller isn't the applicant on the row.

        - `404` if the row doesn't exist.

        - `409` if the row is already in a terminal state (`CANCELLED`, or —
        once   the future owner approve/decline endpoint ships — `APPROVED`
        /   `DECLINED`). In production today, the only terminal state reachable
        is   `CANCELLED`, so a 409 here means "you already cancelled this."


        Persona audit (Temi) flagged the missing cancel surface.
      operationId: cancel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Cancelled; slot freed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /comments/{id}:
    delete:
      tags:
        - Comments
      summary: Soft-delete a comment
      description: >
        Soft-deletes (sets `deleted_at`) — the row is excluded from public reads
        but kept for audit. Authorised callers:


        - The comment's author (anyone removing their own comment).

        - The listing's owner.

        - The listing's assigned agent.

        - Any admin (with optional moderation reason in the body).


        All other callers receive 403.
      operationId: delete_4
      parameters:
        - name: id
          in: path
          description: Comment ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommentRequest"
      responses:
        "204":
          description: Comment soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
