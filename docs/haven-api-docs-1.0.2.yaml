        side effects:


        - `OWNER_IDENTITY` / `APPLICANT_IDENTITY` →
        stamps   `users.identity_verified_at` on the submitter.

        - `AGENT_CREDENTIALS` →
        stamps   `agent_profiles.credential_verified_at`.

        - `PROPERTY_DOCUMENTS` → stamps   `properties.documents_verified_at` on
        the target property.


        Submitter receives a `VERIFICATION_APPROVED` notification. Audit log row
        written.


        Cannot approve a row that's already decided (409).


