openapi: 3.0.1
info:
  title: DreamHomes Haven API
  description: |
    The secure backend powering DreamHomes — the platform that lets
    Nigerian property owners, agents, and applicants transact with
    trust they couldn't get on a WhatsApp group or a wall flyer.

    **Highlights**

    - Stateless JWT auth with token revocation via `tokenVersion`
    - 4-track verification (owner identity, applicant identity, agent
      credential, property documents) with admin moderation
    - Transactional outbox over Kafka so notifications never go missing
    - Public discovery + Cache-Control headers, paginated browse,
      rate-limited auth, request-id correlation across the stack

    See [`docs/users/`](https://github.com/DreamHom/haven/tree/main/docs/users)
    for the personas these endpoints serve.
  contact:
    name: DreamHomes Haven team
    url: https://github.com/DreamHom/haven
  license:
    name: MIT
    url: https://github.com/DreamHom/haven/blob/main/LICENSE
  version: v1
servers:
  - url: http://localhost:8080/api
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Register, log in, and identify the current user.
  - name: Users
    description: Public profiles (including optional `publicBio`), agent badges, and
      the user-facing view of the trust signals admins manage.
  - name: Properties
    description: The physical asset — what the listing is *of*. Owned by a single
      user; one property may back many listings over time. Create accepts
      optional WGS-84 `latitude`/`longitude` (both or neither). Owners (and
      admins) may **PATCH** non-type fields.
  - name: Listings
    description: The thing applicants browse, save, comment on, request inspections
      for, and submit offers against. Responses embed `PropertySummary`
      (address, trust badges, optional lat/lng) plus listing fields such as
      `virtualTourUrl` and `priceNegotiable`.
  - name: Listing photos
    description: Owner / assigned-agent uploads that drive the visual hero of a listing.
  - name: Inspections
    description: Slots an owner / agent opens (`POST /api/listings/{id}/slots`), and
      inspection requests an applicant claims against them (`POST
      /api/inspections`). **Owner approve/decline of a PENDING request is not
      yet a backend feature** — see the `DELETE /api/inspections/{id}`
      description for the current state machine and what the FE should render
      until that ships.
  - name: Offers
    description: Applicant-submitted bids on a listing, including counter-offer
      chains and accept/decline state machine.
  - name: Comments
    description: Public Q&A on listings — anyone authenticated can post, owner /
      agent / commenter can soft-delete.
  - name: Reviews
    description: Post-deal reviews (rating + text) on the user the deal closed with.
      Gates on a CLOSED listing + ACCEPTED offer.
  - name: Saves
    description: Applicant-side bookmarks on listings, surfaced as a personal
      collection and aggregated as engagement signal on the listing.
  - name: Agent assignments
    description: Owner ↔ agent handshake (REQUESTED → ACCEPTED / DECLINED / REVOKED)
      so an agent can act on a listing on behalf of an owner.
  - name: Verifications
    description: Identity / credential / property document submissions that admins
      approve or reject; approvals stamp badges on the user / property.
  - name: Notifications
    description: "Per-user inbox: inspection requests, offers received, verification
      decisions, and other event-driven nudges."
  - name: Admin
    description: "Moderation surface: user suspension, listing takedown,
      verification decisions, audit log."
  - name: Observability
    description: Health, info, metrics — actuator endpoints exposed to platform tooling.
paths:
  /verifications:
    post:
      tags:
        - Verifications
      summary: Submit a verification for admin review
      description: >
        Records a `Verification` row in `PENDING` for an admin to review. Four
        tracks:


        - `OWNER_IDENTITY` — only OWNER role can submit (NIN / C of O proving
        identity).

        - `APPLICANT_IDENTITY` — only APPLICANT role can submit (NIN).

        - `AGENT_CREDENTIALS` — only AGENT role can submit (real-estate
        licence).

        - `PROPERTY_DOCUMENTS` — OWNER role; references a `propertyId` they own.


        On admin approval the corresponding badge is stamped:

        - identity → `users.identity_verified_at`

        - agent credential → `agent_profiles.credential_verified_at`

        - property documents → `properties.documents_verified_at`


        **Constraints**:

        - At most one PENDING submission of the same type per user — duplicates
        → 409.

        - Role must match the type (e.g. APPLICANT cannot submit OWNER_IDENTITY)
        → 403.

        - For PROPERTY_DOCUMENTS, the target property must belong to the caller.
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVerificationRequest"
        required: true
      responses:
        "201":
          description: Verification queued for admin review.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/VerificationResponse"
              examples:
                OwnerIdentitySubmission:
                  description: OwnerIdentitySubmission
                  value:
                    id: 99
                    type: OWNER_IDENTITY
                    status: PENDING
                    submitterUserId: 7
                    targetUserId: 7
                    targetPropertyId: null
                    documentRefs:
                      kind: C_OF_O
                      ref: lagos/lekki/2024/00123
                    submittedAt: 2026-05-10T08:30:00Z
                    decidedAt: null
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /verifications/files:
    post:
      tags:
        - Verifications
      summary: Upload a verification document
      description: |
        Uploads a single file (NIN slip, C of O, agent licence, etc.) into
        the platform's R2 bucket under {@code verifications/{userId}/}.
        Returns the URL the file is hostable at; the client should paste
        that URL into the subsequent `POST /api/verifications` call inside
        `documentRefs`.

        Persona audit: every persona who submits a verification flagged
        the absence of a real upload endpoint. They were being asked to
        host their own NIN / C of O on a public CDN — a data-leakage
        scenario the verification flow itself was supposed to prevent.

        `multipart/form-data` request with field name `file`.
      operationId: uploadFile
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File uploaded. Response contains the public URL.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/UploadedDocumentResponse"
              examples:
                UploadedNin:
                  description: UploadedNin
                  value:
                    url: https://pub-abc.r2.dev/verifications/42/c3a8.jpg
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
  /properties:
    post:
      tags:
        - Properties
      summary: Register a new property
      description: >
        Creates a `Property` row owned by the calling user. The property is the
        physical asset; one or more `Listing`s can be created against it later
        (rent now, sell later, re-list after a tenant turnover — same property,
        multiple listings over time).


        **Ownership**: `ownerId` is taken from the JWT, never from the request
        body. A caller cannot create a property "for" another user.


        **Role gate**: `OWNER` only. APPLICANT and AGENT receive 403.


        Optional **map pin**: `latitude` and `longitude` (WGS-84 decimals) —
        both must be sent together or both omitted.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
        required: true
      responses:
        "201":
          description: Property created.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PropertyResponse"
              examples:
                ApartmentInLekki:
                  description: ApartmentInLekki
                  value:
                    id: 42
                    ownerId: 7
                    type: APARTMENT
                    address: 12B Admiralty Way, Lekki Phase 1, Lagos
                    bedrooms: 3
                    bathrooms: 2
                    sizeSqm: 145
                    description: Top-floor apartment with sea-view balcony.
                    latitude: 6.4541
                    longitude: 3.3947
                    createdAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /properties/bulk:
    post:
      tags:
        - Properties
      summary: Register many properties in one call
      description: |
        Bulk variant of {@code POST /api/properties}. Persona audit (Biodun): a
        developer onboarding a 60-unit tower shouldn't fire 60 sequential HTTP
        calls. Each item is validated independently; the whole batch is one
        transaction — if any single item fails validation the whole call rolls
        back. Responses come back in the same order as the request.

        **Limits**: at most 100 properties per call. Body shape is a JSON array
        of {@link CreatePropertyRequest} objects.
      operationId: createBulk
      requestBody:
        content:
          application/json:
            schema:
              maxItems: 100
              minItems: 1
              type: array
              items:
                $ref: "#/components/schemas/CreatePropertyRequest"
        required: true
      responses:
        "201":
          description: All properties created.
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PropertyResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /offers:
    post:
      tags:
        - Offers
      summary: Submit an offer on a listing
      description: >
        Records a `PENDING` offer at the price + terms the applicant proposes
        and fires an `OFFER_SUBMITTED` notification (via outbox + Kafka) to the
        listing's owner. The offer is the root of a counter-offer chain —
        counters from the owner attach as children via `parentOfferId`.


        **Preconditions**

        - Listing is in `OPEN` state.

        - Caller is not the listing owner (you can't offer on your own listing).

        - Caller has no other PENDING offer on this listing.


        **Side effect**: outbox row + Kafka event + owner notification (and
        assigned-agent notification if any).


        **Role gate**: `APPLICANT`.
      operationId: submit_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOfferRequest"
        required: true
      responses:
        "201":
          description: Offer created in PENDING.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/OfferResponse"
              examples:
                PendingOffer:
                  description: PendingOffer
                  value:
                    id: 42
                    listingId: 17
                    applicantId: 89
                    ownerId: 7
                    amount: 7500000
                    currency: NGN
                    message: Could close this week if accepted.
                    status: PENDING
                    parentOfferId: null
                    proposedByUserId: 89
                    createdAt: 2026-05-10T08:30:00Z
                    updatedAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /offers/{id}/counter:
    post:
      tags:
        - Offers
      summary: Counter an offer
      description: >
        Marks the parent offer as `COUNTERED` and creates a child offer in
        `PENDING` carrying the new amount + message. The chain links via
        `parentOfferId` — `GET` traversal of a single offer's lineage shows the
        full negotiation arc.


        **Side effect**: notification fires to the other party (the original
        proposer of the parent offer).


        **Role gate**: OWNER or APPLICANT — service does the "you must not be
        the proposer of the parent" check.
      operationId: counter
      parameters:
        - name: id
          in: path
          description: Parent offer ID being countered.
          required: true
          schema:
            type: integer
            format: int64
          example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterOfferRequest"
        required: true
      responses:
        "200":
          description: Counter-offer created; parent moved to COUNTERED.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/OfferResponse"
              examples:
                CounteredOffer:
                  description: CounteredOffer
                  value:
                    id: 43
                    listingId: 17
                    applicantId: 89
                    ownerId: 7
                    amount: 8000000
                    currency: NGN
                    message: Closer to ask. Could meet at 8m.
                    status: PENDING
                    parentOfferId: 42
                    proposedByUserId: 7
                    createdAt: 2026-05-11T10:00:00Z
                    updatedAt: 2026-05-11T10:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /notifications/{id}/mark-read:
    post:
      tags:
        - Notifications
      summary: Mark a notification as read
      description: >
        Stamps `readAt` on the target notification (idempotent — already-read
        re-mark is a no-op). The notification must belong to the caller; marking
        someone else's notification as read returns 403.
      operationId: markRead
      parameters:
        - name: id
          in: path
          description: Notification ID to mark read.
          required: true
          schema:
            type: integer
            format: int64
          example: 201
      responses:
        "200":
          description: Updated notification with `readAt` populated.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /notifications/mark-all-read:
    post:
      tags:
        - Notifications
      summary: Mark all my notifications as read
      description: >
        Bulk-flip every unread notification for the caller to read. Idempotent —

        already-read notifications are skipped. Returns the count actually
        flipped.

        Persona audit (Biodun, Temi) flagged that one-at-a-time mark-read is

        unusable past a handful of notifications.
      operationId: markAllRead
      responses:
        "200":
          description: 'Returns `{ "marked": <int> }` — count of notifications flipped.'
          content:
            "*/*":
              examples:
                MarkedFive:
                  description: MarkedFive
                  value:
                    marked: 5
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
  /me/password:
    post:
      tags:
        - Auth
      summary: Change the current user's password
      description: >
        Requires the current password for re-authentication, then stores the new
        password hash and bumps `tokenVersion` so every previously-issued JWT
        for the account is rejected on its next request.
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeMyPasswordRequest"
        required: true
      responses:
        "204":
          description: Password changed; other sessions invalidated.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /me/avatar:
    post:
      tags:
        - Auth
      summary: Upload my profile avatar
      description: >
        Multipart upload stored under the configured photo backend
        (`haven.photos.storage=r2` in production). The returned public URL is
        written to `profile_image_url` on the user.
      operationId: uploadAvatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar stored; private profile returned.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PrivateUserProfile"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
  /me/agent-marketing:
    get:
      tags:
        - Agent marketing gallery
      summary: List your marketing gallery items
      operationId: list
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMarketingMediaResponse"
      security:
        - bearerAuth: []
    post:
      tags:
        - Agent marketing gallery
      summary: Upload a marketing gallery image
      operationId: upload
      parameters:
        - name: caption
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
                - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Created
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AgentMarketingMediaResponse"
      security:
        - bearerAuth: []
  /me/ad-campaigns:
    get:
      tags:
        - Ads
      summary: List my ad campaigns
      description: Newest first.
      operationId: list_1
      parameters:
        - name: pageable
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated campaigns.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PagedModelAdCampaignResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
    post:
      tags:
        - Ads
      summary: Create my ad campaign
      description: Creates a `DRAFT` row owned by the JWT subject.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdCampaignRequest"
        required: true
      responses:
        "201":
          description: Draft created.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/AdCampaignResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
      security:
        - bearerAuth: []
  /listings:
    get:
      tags:
        - Listings
      summary: Browse public listings
      description: >
        Paginated list of publicly-visible listings (status `LIVE`, not
        administratively taken down). Public — no auth required, designed for
        anonymous discovery.


        Response carries `Cache-Control: public, max-age=...` so a CDN or
        browser can serve repeat hits without round-tripping to Postgres. Newly
        published or status-changed listings can take one cache TTL to reflect.


        Use `?page=` and `?size=` for pagination (defaults: page 0, size 20).
        Sort defaults to creation time descending.
      operationId: browse
      parameters:
        - name: listingType
          in: query
          description: "Filter by listing type: RENT or SALE."
          required: false
          schema:
            type: string
            enum:
              - RENT
              - SALE
        - name: priceMin
          in: query
          description: Minimum asking price (inclusive).
          required: false
          schema:
            type: number
        - name: priceMax
          in: query
          description: Maximum asking price (inclusive).
          required: false
          schema:
            type: number
        - name: bedrooms
          in: query
          description: Restrict to listings whose property has exactly this bedroom count.
          required: false
          schema:
            type: integer
            format: int32
        - name: propertyType
          in: query
          description: "Filter by property type: APARTMENT, HOUSE, SELF_CONTAIN, etc."
          required: false
          schema:
            type: string
            enum:
              - APARTMENT
              - HOUSE
              - LAND
              - COMMERCIAL
              - SELF_CONTAIN
              - MINI_FLAT
              - STUDIO
              - ROOM_AND_PARLOUR
        - name: location
          in: query
          description: Case-insensitive substring of the property address (e.g. 'Yaba').
          required: false
          schema:
            type: string
        - name: pageable
          in: query
          description: Standard Spring pagination — defaults to page=0&size=20.
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated `Page<ListingResponse>` envelope.
          content:
            "*/*":
              examples:
                FirstPage:
                  description: FirstPage
                  value:
                    content:
                      - id: 17
                        propertyId: 42
                        ownerId: 7
                        type: RENT
                        price: 850000
                        currency: NGN
                        status: LIVE
                        title: 3-bed apartment, Lekki
                        createdAt: 2026-05-10T08:30:00Z
                    page:
                      size: 20
                      number: 0
                      totalElements: 1
                      totalPages: 1
      security: []
    post:
      tags:
        - Listings
      summary: Publish a listing
      description: >
        Creates a `Listing` against one of the caller's properties at the chosen
        type (`RENT` / `SALE`) and price. The listing starts in `LIVE` status —
        publicly browsable immediately, no admin pre-approval gate. Admin only
        intervenes reactively via takedown.


        **Ownership**: the caller must own the target `Property` (FK check).
        Trying to list someone else's property returns 403.


        **Role gate**: `OWNER` only. Agents publish via the agent-assignment
        flow.


        Optional marketing: `virtualTourUrl` (max 2048 chars), `priceNegotiable`
        (defaults to `false` when omitted). The response includes
        `ownerPublicBio` when the owner has set `publicBio` on their account
        (`PATCH /api/me`).
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
        required: true
      responses:
        "201":
          description: Listing created in LIVE.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ListingResponse"
              examples:
                OpenRental:
                  description: OpenRental
                  value:
                    id: 17
                    propertyId: 42
                    ownerId: 7
                    type: RENT
                    price: 850000
                    currency: NGN
                    status: LIVE
                    title: 3-bed apartment, Lekki
                    description: Top-floor with sea view.
                    createdAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/{listingId}/videos:
    get:
      tags:
        - Listing videos
      summary: List video URLs for a listing (public)
      operationId: list_2
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Ordered gallery; empty list is valid.
          content:
            "*/*":
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PhotoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
    post:
      tags:
        - Listing videos
      summary: Add a video URL to a listing (owner)
      operationId: add
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddListingVideoRequest"
        required: true
      responses:
        "201":
          description: Video metadata stored.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PhotoResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/{listingId}/slots:
    get:
      tags:
        - Inspections
      summary: List available inspection slots for a listing
      description: >
        Returns slots that are still open for booking on this listing — slots
        already claimed by an inspection request are excluded.


        Public — no auth required. Cache-Control headers stamped by the
        public-cache interceptor.
      operationId: listAvailable
