  /offers/{id}:
    delete:
      tags:
        - Offers
      summary: Withdraw my offer
      description: |
        Applicant withdraws a PENDING offer they submitted. Frees the listing to
        receive a fresh offer from the same applicant. Returns 409 if the offer
        is no longer PENDING (owner already accepted/declined/countered). 403 if
        the caller is not the applicant on this offer.
      operationId: withdraw
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Offer withdrawn.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
    patch:
      tags:
        - Offers
      summary: Respond to an offer (accept or decline)
      description: >
        Transitions a PENDING offer to `ACCEPTED` or `DECLINED`. Either side of
        the negotiation can call this against an offer the **other** side
        proposed (the service rejects "responding to your own proposal" with
        403).


        **Critical rule**: when an offer is `ACCEPTED`, every other PENDING
        offer on the same listing is locked from acceptance — the listing has a
        single accepted deal at most. The state-machine + the listing's
        `@Version` enforces this; concurrent accepts of two different offers on
        the same listing — only one wins, the other gets 409.


        **State machine**: `PENDING` → `ACCEPTED` | `DECLINED` | `COUNTERED`.
        Re-acting on a terminal state returns 409.


        **Role gate**: OWNER or APPLICANT — service does fine-grained "you must
        not be the proposer" check.
      operationId: respond
      parameters:
        - name: id
          in: path
          description: Offer ID to respond to.
          required: true
          schema:
            type: integer
            format: int64
          example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToOfferRequest"
        required: true
      responses:
        "200":
          description: Offer transitioned. Response shows the new status.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/OfferResponse"
              examples:
                AcceptedOffer:
                  description: AcceptedOffer
                  value:
                    id: 42
                    listingId: 17
                    applicantId: 89
                    ownerId: 7
                    amount: 7500000
                    currency: NGN
                    status: ACCEPTED
                    parentOfferId: null
                    proposedByUserId: 89
                    createdAt: 2026-05-10T08:30:00Z
                    updatedAt: 2026-05-11T09:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
