openapi: 3.0.1
info:
  title: DreamHomes Haven API
  description: |
    The secure backend powering DreamHomes — the platform that lets
    Nigerian property owners, agents, and applicants transact with
    trust they couldn't get on a WhatsApp group or a wall flyer.

    **Highlights**

    - Stateless JWT auth with token revocation via `tokenVersion`
    - 4-track verification (owner identity, applicant identity, agent
      credential, property documents) with admin moderation
    - Transactional outbox over Kafka so notifications never go missing
    - Public discovery + Cache-Control headers, paginated browse,
      rate-limited auth, request-id correlation across the stack

    See [`docs/users/`](https://github.com/DreamHom/haven/tree/main/docs/users)
    for the personas these endpoints serve.
  contact:
    name: DreamHomes Haven team
    url: https://github.com/DreamHom/haven
  license:
    name: MIT
    url: https://github.com/DreamHom/haven/blob/main/LICENSE
  version: v1
servers:
  - url: http://localhost:8080/api
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Register, log in, and identify the current user.
  - name: Users
    description: Public profiles, agent badges, and the user-facing view of the
      trust signals admins manage.
  - name: Properties
    description: The physical asset — what the listing is *of*. Owned by a single
      user; one property may back many listings over time.
  - name: Listings
    description: The thing applicants browse, save, comment on, request inspections
      for, and submit offers against.
  - name: Listing photos
    description: Owner / assigned-agent uploads that drive the visual hero of a listing.
  - name: Inspections
    description: Slots an owner / agent opens, and inspection requests an applicant
      claims against them.
  - name: Offers
    description: Applicant-submitted bids on a listing, including counter-offer
      chains and accept/decline state machine.
  - name: Comments
    description: Public Q&A on listings — anyone authenticated can post, owner /
      agent / commenter can soft-delete.
  - name: Reviews
    description: Post-deal reviews (rating + text) on the user the deal closed with.
      Gates on a CLOSED listing + ACCEPTED offer.
  - name: Saves
    description: Applicant-side bookmarks on listings, surfaced as a personal
      collection and aggregated as engagement signal on the listing.
  - name: Agent assignments
    description: Owner ↔ agent handshake (REQUESTED → ACCEPTED / DECLINED / REVOKED)
      so an agent can act on a listing on behalf of an owner.
  - name: Verifications
    description: Identity / credential / property document submissions that admins
      approve or reject; approvals stamp badges on the user / property.
  - name: Notifications
    description: "Per-user inbox: inspection requests, offers received, verification
      decisions, and other event-driven nudges."
  - name: Admin
    description: "Moderation surface: user suspension, listing takedown,
      verification decisions, audit log."
  - name: Observability
    description: Health, info, metrics — actuator endpoints exposed to platform tooling.
paths:
  /verifications:
    post:
      tags:
        - Verifications
      summary: Submit a verification for admin review
      description: >
        Records a `Verification` row in `PENDING` for an admin to review. Four
        tracks:


        - `OWNER_IDENTITY` — only OWNER role can submit (NIN / C of O proving
        identity).

        - `APPLICANT_IDENTITY` — only APPLICANT role can submit (NIN).

        - `AGENT_CREDENTIALS` — only AGENT role can submit (real-estate
        licence).

        - `PROPERTY_DOCUMENTS` — OWNER role; references a `propertyId` they own.


        On admin approval the corresponding badge is stamped:

        - identity → `users.identity_verified_at`

        - agent credential → `agent_profiles.credential_verified_at`

        - property documents → `properties.documents_verified_at`


        **Constraints**:

        - At most one PENDING submission of the same type per user — duplicates
        → 409.

        - Role must match the type (e.g. APPLICANT cannot submit OWNER_IDENTITY)
        → 403.

        - For PROPERTY_DOCUMENTS, the target property must belong to the caller.
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitVerificationRequest"
        required: true
      responses:
        "201":
          description: Verification queued for admin review.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/VerificationResponse"
              examples:
                OwnerIdentitySubmission:
                  description: OwnerIdentitySubmission
                  value:
                    id: 99
                    type: OWNER_IDENTITY
                    status: PENDING
                    submitterUserId: 7
                    targetUserId: 7
                    targetPropertyId: null
                    documentRefs:
                      kind: C_OF_O
                      ref: lagos/lekki/2024/00123
                    submittedAt: 2026-05-10T08:30:00Z
                    decidedAt: null
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /properties:
    post:
      tags:
        - Properties
      summary: Register a new property
      description: >
        Creates a `Property` row owned by the calling user. The property is the
        physical asset; one or more `Listing`s can be created against it later
        (rent now, sell later, re-list after a tenant turnover — same property,
        multiple listings over time).


        **Ownership**: `ownerId` is taken from the JWT, never from the request
        body. A caller cannot create a property "for" another user.


        **Role gate**: `OWNER` only. APPLICANT and AGENT receive 403.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePropertyRequest"
        required: true
      responses:
        "201":
          description: Property created.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PropertyResponse"
              examples:
                ApartmentInLekki:
                  description: ApartmentInLekki
                  value:
                    id: 42
                    ownerId: 7
                    type: APARTMENT
                    address: 12B Admiralty Way, Lekki Phase 1, Lagos
                    bedrooms: 3
                    bathrooms: 2
                    sizeSqm: 145
                    description: Top-floor apartment with sea-view balcony.
                    createdAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /offers:
    post:
      tags:
        - Offers
      summary: Submit an offer on a listing
      description: >
        Records a `PENDING` offer at the price + terms the applicant proposes
        and fires an `OFFER_SUBMITTED` notification (via outbox + Kafka) to the
        listing's owner. The offer is the root of a counter-offer chain —
        counters from the owner attach as children via `parentOfferId`.


        **Preconditions**

        - Listing is in `OPEN` state.

        - Caller is not the listing owner (you can't offer on your own listing).

        - Caller has no other PENDING offer on this listing.


        **Side effect**: outbox row + Kafka event + owner notification (and
        assigned-agent notification if any).


        **Role gate**: `APPLICANT`.
      operationId: submit_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOfferRequest"
        required: true
      responses:
        "201":
          description: Offer created in PENDING.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/OfferResponse"
              examples:
                PendingOffer:
                  description: PendingOffer
                  value:
                    id: 42
                    listingId: 17
                    applicantId: 89
                    ownerId: 7
                    amount: 7500000
                    currency: NGN
                    message: Could close this week if accepted.
                    status: PENDING
                    parentOfferId: null
                    proposedByUserId: 89
                    createdAt: 2026-05-10T08:30:00Z
                    updatedAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /offers/{id}/counter:
    post:
      tags:
        - Offers
      summary: Counter an offer
      description: >
        Marks the parent offer as `COUNTERED` and creates a child offer in
        `PENDING` carrying the new amount + message. The chain links via
        `parentOfferId` — `GET` traversal of a single offer's lineage shows the
        full negotiation arc.


        **Side effect**: notification fires to the other party (the original
        proposer of the parent offer).


        **Role gate**: OWNER or APPLICANT — service does the "you must not be
        the proposer of the parent" check.
      operationId: counter
      parameters:
        - name: id
          in: path
          description: Parent offer ID being countered.
          required: true
          schema:
            type: integer
            format: int64
          example: 42
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterOfferRequest"
        required: true
      responses:
        "200":
          description: Counter-offer created; parent moved to COUNTERED.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/OfferResponse"
              examples:
                CounteredOffer:
                  description: CounteredOffer
                  value:
                    id: 43
                    listingId: 17
                    applicantId: 89
                    ownerId: 7
                    amount: 8000000
                    currency: NGN
                    message: Closer to ask. Could meet at 8m.
                    status: PENDING
                    parentOfferId: 42
                    proposedByUserId: 7
                    createdAt: 2026-05-11T10:00:00Z
                    updatedAt: 2026-05-11T10:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /notifications/{id}/mark-read:
    post:
      tags:
        - Notifications
      summary: Mark a notification as read
      description: >
        Stamps `readAt` on the target notification (idempotent — already-read
        re-mark is a no-op). The notification must belong to the caller; marking
        someone else's notification as read returns 403.
      operationId: markRead
      parameters:
        - name: id
          in: path
          description: Notification ID to mark read.
          required: true
          schema:
            type: integer
            format: int64
          example: 201
      responses:
        "200":
          description: Updated notification with `readAt` populated.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings:
    get:
      tags:
        - Listings
      summary: Browse public listings
      description: >
        Paginated list of publicly-visible listings (status `OPEN`, not
        administratively taken down). Public — no auth required, designed for
        anonymous discovery.


        Response carries `Cache-Control: public, max-age=...` so a CDN or
        browser can serve repeat hits without round-tripping to Postgres. Newly
        published or status-changed listings can take one cache TTL to reflect.


        Use `?page=` and `?size=` for pagination (defaults: page 0, size 20).
        Sort defaults to creation time descending.
      operationId: browse
      parameters:
        - name: pageable
          in: query
          description: Standard Spring pagination — defaults to page=0&size=20.
          required: true
          schema:
            $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: Paginated `Page<ListingResponse>` envelope.
          content:
            "*/*":
              examples:
                FirstPage:
                  description: FirstPage
                  value:
                    content:
                      - id: 17
                        propertyId: 42
                        ownerId: 7
                        type: RENT
                        price: 850000
                        currency: NGN
                        status: OPEN
                        title: 3-bed apartment, Lekki
                        createdAt: 2026-05-10T08:30:00Z
                    page:
                      size: 20
                      number: 0
                      totalElements: 1
                      totalPages: 1
      security: []
    post:
      tags:
        - Listings
      summary: Publish a listing
      description: >
        Creates a `Listing` against one of the caller's properties at the chosen
        type (`RENT` / `SALE`) and price. The listing starts in `OPEN` status —
        publicly browsable immediately, no admin pre-approval gate. Admin only
        intervenes reactively via takedown.


        **Ownership**: the caller must own the target `Property` (FK check).
        Trying to list someone else's property returns 403.


        **Role gate**: `OWNER` only. Agents publish via the agent-assignment
        flow.
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
        required: true
      responses:
        "201":
          description: Listing created in OPEN.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ListingResponse"
              examples:
                OpenRental:
                  description: OpenRental
                  value:
                    id: 17
                    propertyId: 42
                    ownerId: 7
                    type: RENT
                    price: 850000
                    currency: NGN
                    status: OPEN
                    title: 3-bed apartment, Lekki
                    description: Top-floor with sea view.
                    createdAt: 2026-05-10T08:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/{listingId}/slots:
    get:
      tags:
        - Inspections
      summary: List available inspection slots for a listing
      description: >
        Returns slots that are still open for booking on this listing — slots
        already claimed by an inspection request are excluded.


        Public — no auth required. Cache-Control headers stamped by the
        public-cache interceptor.
      operationId: listAvailable
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      responses:
        "200":
          description: Available slots for the listing. Empty list is valid.
          content:
            "*/*":
              examples:
                ThreeOpenSlots:
                  description: ThreeOpenSlots
                  value:
                    - id: 12
                      listingId: 17
                      startsAt: 2026-05-17T10:00:00Z
                      endsAt: 2026-05-17T10:30:00Z
                    - id: 13
                      listingId: 17
                      startsAt: 2026-05-17T11:00:00Z
                      endsAt: 2026-05-17T11:30:00Z
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
    post:
      tags:
        - Inspections
      summary: Open an inspection slot on a listing
      description: >
        Records an `InspectionSlot` window during which applicants can claim an
        inspection. Slots are publicly visible to anyone browsing the listing.


        **Authorisation**: the listing's owner (today). Assigned-agent slot
        creation is wired in the service layer for when the AgentListing flow
        grants the agent permission.


        **Overlap constraint**: enforced by a Postgres `EXCLUDE USING GIST`
        constraint on `(listing_id, time_range)`. Trying to open a slot that
        intersects an existing active slot for the same listing returns 409.
      operationId: create_2
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSlotRequest"
        required: true
      responses:
        "201":
          description: Slot created and publicly visible.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/SlotResponse"
              examples:
                WeekendSlot:
                  description: WeekendSlot
                  value:
                    id: 12
                    listingId: 17
                    startsAt: 2026-05-17T10:00:00Z
                    endsAt: 2026-05-17T10:30:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /listings/{listingId}/save:
    post:
      tags:
        - Saves
      summary: Save a listing
      description: >
        Bookmarks the listing for the calling user. **Idempotent** — saving the
        same listing twice succeeds (the existing row is left in place). The
        save shows up under `GET /saves/mine` and feeds the listing's aggregated
        engagement signal.


        Returns 204 with no body either way.
      operationId: save
      parameters:
        - name: listingId
          in: path
          description: Listing ID to save.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      responses:
        "204":
          description: Saved (or already saved — idempotent).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
    delete:
      tags:
        - Saves
      summary: Un-save a listing
      description: >
        Removes the save row for the calling user against the target listing.
        Idempotent — un-saving something you didn't save returns 204 with no
        error.
      operationId: unsave
      parameters:
        - name: listingId
          in: path
          description: Listing ID to un-save.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      responses:
        "204":
          description: Un-saved (or wasn't saved — idempotent).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/{listingId}/reviews:
    get:
      tags:
        - Reviews
      summary: List reviews tied to a listing
      description: >
        Paginated reviews on the listing — both directions (owner-reviewing-
        applicant and applicant-reviewing-owner). Soft-deleted reviews excluded.
        Public — no auth required.
      operationId: listForListing
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Paginated reviews on the listing.
          content:
            "*/*":
              examples:
                OneReview:
                  description: OneReview
                  value:
                    content:
                      - id: 14
                        listingId: 17
                        reviewerUserId: 89
                        revieweeUserId: 23
                        rating: 5
                        body: Responsive and honest.
                        createdAt: 2026-06-15T14:00:00Z
                    page:
                      size: 20
                      number: 0
                      totalElements: 1
                      totalPages: 1
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
    post:
      tags:
        - Reviews
      summary: Post a review on the user the deal closed with
      description: >
        Records a 1-5 star review with optional text body. The reviewee can be
        the listing's owner OR the listing's assigned agent — whoever you
        actually transacted with.


        **Gating** (enforced server-side):

        - Listing status must be `CLOSED`.

        - The caller must have an `ACCEPTED` offer on this listing (you
        can   only review someone you closed a deal with).

        - The chosen `revieweeUserId` must be the listing owner or its assigned
        agent.

        - At most one review per `(listingId, reviewerUserId, revieweeUserId)`
        —   duplicates rejected with 409.


        **Side effect**: the reviewee's profile aggregate (`averageRating`,
        `reviewCount`) is updated immediately on every write/delete.
      operationId: post
      parameters:
        - name: listingId
          in: path
          description: Listing the deal closed on.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostReviewRequest"
        required: true
      responses:
        "201":
          description: Review created and aggregate updated.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ReviewResponse"
              examples:
                FiveStar:
                  description: FiveStar
                  value:
                    id: 14
                    listingId: 17
                    reviewerUserId: 89
                    revieweeUserId: 23
                    rating: 5
                    body: Responsive and honest. Highly recommended.
                    createdAt: 2026-06-15T14:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /listings/{listingId}/photos:
    get:
      tags:
        - Listing photos
      summary: List the photos for a listing
      description: >
        Returns photos in `displayOrder` ascending. Public — no auth required.
        Cache-Control headers stamped by the public-cache interceptor; CDN can
        serve repeat hits cheaply.
      operationId: list
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      responses:
        "200":
          description: Photos in display order. Empty list is valid.
          content:
            "*/*":
              examples:
                ThreePhotos:
                  description: ThreePhotos
                  value:
                    - id: 86
                      listingId: 17
                      url: https://r2.dreamhomes.example/listings/17/exterior.jpg
                      displayOrder: 0
                      caption: Building exterior
                      uploadedAt: 2026-05-09T20:00:00Z
                    - id: 87
                      listingId: 17
                      url: https://r2.dreamhomes.example/listings/17/kitchen.jpg
                      displayOrder: 1
                      caption: Kitchen
                      uploadedAt: 2026-05-09T20:01:00Z
                    - id: 88
                      listingId: 17
                      url: https://r2.dreamhomes.example/listings/17/hero.jpg
                      displayOrder: 2
                      caption: Living room
                      uploadedAt: 2026-05-10T09:00:00Z
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
    post:
      tags:
        - Listing photos
      summary: Attach a photo to a listing
      description: >
        Records a `ListingPhoto` row pointing at an externally-hosted image URL
        (R2-uploaded image when the upload pipeline lands; for now, any URL the
        caller supplies). Server assigns the next `displayOrder` so the most
        recent photo is appended at the end of the gallery.


        **Ownership**: only the listing's owner can attach photos today.
        Assigned-agent upload is a likely future enhancement.


        **Role gate**: `OWNER`.
      operationId: add
      parameters:
        - name: listingId
          in: path
          description: Listing to attach the photo to.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPhotoRequest"
        required: true
      responses:
        "201":
          description: Photo recorded; `displayOrder` assigned by the server.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PhotoResponse"
              examples:
                AppendedPhoto:
                  description: AppendedPhoto
                  value:
                    id: 88
                    listingId: 17
                    url: https://r2.dreamhomes.example/listings/17/hero.jpg
                    displayOrder: 3
                    caption: Living room
                    uploadedAt: 2026-05-10T09:00:00Z
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /listings/{listingId}/comments:
    get:
      tags:
        - Comments
      summary: List comments on a listing
      description: >
        Paginated public Q&A on the listing. Soft-deleted rows (`deleted_at`
        set) are excluded. Public — no auth required. Cache-Control headers
        stamped by the public-cache interceptor.
      operationId: list_1
      parameters:
        - name: listingId
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
        - name: page
          in: query
