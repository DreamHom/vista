  /reviews/{id}:
    delete:
      tags:
        - Reviews
      summary: Soft-delete a review
      description: >
        Soft-deletes (sets `deleted_at`). The reviewee's aggregate
        (`averageRating`, `reviewCount`) is recomputed accordingly.


        **Authorisation** (service-enforced):

        - The review's author can delete their own review.

        - Any admin can delete any review (with reason — audit-friendly).

        - All others receive 403.


        Reason is required.
      operationId: delete
      parameters:
        - name: id
          in: path
          description: Review ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 14
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteReviewRequest"
        required: true
      responses:
        "204":
          description: Review soft-deleted.
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /listings/photos/{photoId}:
    delete:
      tags:
        - Listing photos
      summary: Remove a photo from a listing
      description: >
        Hard-deletes the `ListingPhoto` row. Surrounding photos keep their
        existing `displayOrder` values — gaps are tolerated, the gallery just
        skips them.


        **Ownership**: only the listing's owner can delete photos.
      operationId: delete_1
      parameters:
        - name: photoId
          in: path
          description: Photo ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 88
      responses:
        "204":
          description: Photo removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
  /comments/{id}:
    delete:
      tags:
        - Comments
      summary: Soft-delete a comment
      description: >
        Soft-deletes (sets `deleted_at`) — the row is excluded from public reads
        but kept for audit. Authorised callers:


        - The comment's author (anyone removing their own comment).

        - The listing's owner.

        - The listing's assigned agent.

        - Any admin (with optional moderation reason in the body).


        All other callers receive 403.
      operationId: delete_2
      parameters:
        - name: id
          in: path
          description: Comment ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCommentRequest"
      responses:
        "204":
          description: Comment soft-deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - bearerAuth: []
