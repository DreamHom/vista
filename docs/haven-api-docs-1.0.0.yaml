            format: int64
          example: 17
      responses:
        "200":
          description: Listing with embedded property snapshot.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
    patch:
      tags:
        - Listings
      summary: Update a listing (price / status / description)
      description: >
        Partial update of caller's own listing. Allowed mutations: title,
        description, price, status. **Status transitions are state-machine
        validated** — `OPEN ↔ PAUSED` is allowed, `OPEN → CLOSED` is allowed,
        but `CLOSED → OPEN` is rejected with 409.


        **Ownership**: only the listing's owner can update. Assigned agents
        cannot mutate listing fields directly today (PATCH-via-agent could be a
        future enhancement).


        **Concurrency**: the entity carries `@Version`. A racing PATCH against
        the same row produces 409.
      operationId: update
      parameters:
        - name: id
          in: path
          description: Listing ID.
          required: true
          schema:
            type: integer
            format: int64
          example: 17
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateListingRequest"
        required: true
      responses:
        "200":
          description: Listing updated.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
        - bearerAuth: []
  /users/{userId}/reviews:
    get:
      tags:
        - Reviews
      summary: List the reviews someone has received
      description: >
        Paginated reviews where this user is the **reviewee** — what others have
        said about them. Soft-deleted reviews excluded. Public — no auth
        required, designed for trust-signal scrutiny before engaging.


        Pair with `GET /users/{id}/profile` for the aggregate (average rating +
        count).
      operationId: listForUser
      parameters:
        - name: userId
          in: path
          description: User ID whose reviews to read.
          required: true
          schema:
            type: integer
            format: int64
          example: 23
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        "200":
          description: Paginated reviews this user has received.
          content:
            "*/*":
              examples:
                AgentReviews:
                  description: AgentReviews
                  value:
                    content:
                      - id: 14
                        listingId: 17
                        reviewerUserId: 89
                        revieweeUserId: 23
                        rating: 5
                        body: Responsive and honest.
                        createdAt: 2026-06-15T14:00:00Z
                      - id: 9
                        listingId: 11
                        reviewerUserId: 41
                        revieweeUserId: 23
                        rating: 4
                        body: Smooth process.
                        createdAt: 2026-04-01T11:00:00Z
                    page:
                      size: 20
                      number: 0
                      totalElements: 2
                      totalPages: 1
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
  /users/{id}/profile:
    get:
      tags:
        - Users
      summary: Read a user's public profile
      description: >
        Returns the public-facing trust signals: name, role, verified-identity
        timestamp, agent-credential-verified timestamp (for agents), average
        review rating, and review count. **Never** returns email, phone,
        password hash, or `tokenVersion`.


        Public — no JWT required. Response carries `Cache-Control: public,
        max-age=...` so a CDN or browser cache can serve repeat hits without
        round-tripping to Postgres. The badge fields update lazily — a freshly
        verified user may take one cache TTL to reflect their badge to anonymous
        viewers.
      operationId: getPublicProfile
      parameters:
        - name: id
          in: path
          description: User ID to look up.
          required: true
          schema:
            type: integer
            format: int64
          example: 7
      responses:
        "200":
          description: Public profile returned. Verified-* timestamps populated only when
            the user has been admin-approved.
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
              examples:
                VerifiedAgent:
                  description: VerifiedAgent
                  value:
                    id: 23
                    fullName: Emeka Okonkwo
                    role: AGENT
                    identityVerifiedAt: 2026-04-12T10:00:00Z
                    agentCredentialVerifiedAt: 2026-04-13T11:00:00Z
                    averageRating: 4.8
                    reviewCount: 23
                    suspended: false
                UnverifiedOwner:
                  description: UnverifiedOwner
                  value:
                    id: 7
                    fullName: Amaka Okafor
                    role: OWNER
                    identityVerifiedAt: null
                    agentCredentialVerifiedAt: null
                    averageRating: null
                    reviewCount: 0
                    suspended: false
        "404":
          $ref: "#/components/responses/NotFound"
      security: []
  /saves/mine:
    get:
      tags:
        - Saves
      summary: List my saved listings
      description: >
        Paginated list of the calling user's `ListingSave` rows. Private —
        scoped to the JWT subject; nobody else can read another user's saves via
        this endpoint.
      operationId: listMine
      parameters:
        - name: page
          in: query
