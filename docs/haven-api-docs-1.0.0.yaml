  responses:
    Unauthenticated:
      description: Missing, expired, or revoked JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Unauthenticated:
              value: '{"type":"https://errors.dreamhomes.example/unauthenticated","title":"Unauthorized","status":401,"detail":"unauthenticated"}'
    Forbidden:
      description: Caller authenticated but lacks the required role, ownership, or
        assignment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Forbidden:
              value: '{"type":"https://errors.dreamhomes.example/forbidden","title":"Forbidden","status":403,"detail":"forbidden"}'
    NotFound:
      description: Target resource does not exist (or is no longer visible to the caller).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            NotFound:
              value: '{"type":"https://errors.dreamhomes.example/not-found","title":"Not
                Found","status":404,"detail":"resource not found"}'
    Conflict:
      description: Request collides with current state — illegal state transition,
        duplicate row, or optimistic-lock contention.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            Conflict:
              value: '{"type":"https://errors.dreamhomes.example/conflict","title":"Conflict","status":409,"detail":"resource
                state prevents this operation"}'
    ValidationFailed:
      description: Request body or query parameter failed jakarta.validation constraints.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            ValidationFailed:
              value: '{"type":"https://errors.dreamhomes.example/validation-failed","title":"Bad
                Request","status":400,"detail":"validation
                failed","errors":[{"field":"email","message":"must be a
                well-formed email"}]}'
    RateLimited:
      description: Per-IP token bucket exhausted on a rate-limited path (currently
        `POST /auth/register` and `POST /auth/login`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            RateLimited:
              value: '{"type":"https://errors.dreamhomes.example/rate-limited","title":"Too
                Many Requests","status":429,"detail":"rate limit exceeded"}'
  securitySchemes:
    bearerAuth:
      type: http
      description: "JWT issued by `POST /auth/login`. Send as `Authorization: Bearer
        <token>`."
      scheme: bearer
      bearerFormat: JWT
